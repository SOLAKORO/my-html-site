<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 音声文字起こしアプリ</title>
    <style>
        /* スタイルは前回と同じです */
        :root {
            --primary-color: #4CAF50;
            --danger-color: #f44336;
            --bg-color: #f4f7f6;
            --text-color: #333;
        }
        body { font-family: sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 600px; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); box-sizing: border-box; }
        h1 { text-align: center; font-size: 1.5rem; margin-bottom: 20px; }
        .controls { display: flex; justify-content: center; gap: 15px; margin-bottom: 20px; }
        button { padding: 12px 24px; font-size: 1rem; border: none; border-radius: 50px; cursor: pointer; font-weight: bold; }
        #start-btn { background-color: var(--primary-color); color: white; }
        #stop-btn { background-color: var(--danger-color); color: white; display: none; }
        .status { text-align: center; margin-bottom: 15px; font-size: 0.9rem; color: #666; min-height: 1.5em; word-break: break-all; }
        textarea { width: 100%; height: 250px; padding: 15px; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; line-height: 1.6; box-sizing: border-box; }
        .clear-btn { margin-top: 10px; background-color: #e0e0e0; width: 100%; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎙️ 音声文字起こしアプリ</h1>
        
        <div class="status" id="status">Safariで開き、マイクを許可してください</div>
        
        <div class="controls">
            <button id="start-btn">録音開始</button>
            <button id="stop-btn">録音停止</button>
        </div>

        <textarea id="result-text" placeholder="ここに文字起こしされたテキストが表示されます..." readonly></textarea>
        
        <button id="clear-btn" class="clear-btn">テキストをクリア</button>
    </div>

    <script>
        // Web Speech APIの互換性チェック
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const statusText = document.getElementById('status');
        
        if (!SpeechRecognition) {
            statusText.innerText = "このブラウザは非対応です。iPhoneの場合は必ず「Safari」を使用してください。";
        } else {
            const recognition = new SpeechRecognition();
            
            // iOS Safari向けの最適化
            recognition.lang = 'ja-JP';
            recognition.interimResults = true;
            // iOSはcontinuousをtrueにすると動作が不安定になることがあるため、
            // 途切れたら自動再開するような作りにするのが一般的ですが、まずは標準設定で試します。
            recognition.continuous = true; 

            const startBtn = document.getElementById('start-btn');
            const stopBtn = document.getElementById('stop-btn');
            const clearBtn = document.getElementById('clear-btn');
            const resultTextArea = document.getElementById('result-text');

            let finalTranscript = ''; 

            startBtn.addEventListener('click', () => {
                try {
                    recognition.start();
                    statusText.innerText = 'マイクの許可を待っています...';
                } catch(e) {
                    statusText.innerText = `起動エラー: ${e.message}`;
                }
            });

            stopBtn.addEventListener('click', () => {
                recognition.stop();
            });

            clearBtn.addEventListener('click', () => {
                finalTranscript = '';
                resultTextArea.value = '';
            });

            recognition.onstart = () => {
                startBtn.style.display = 'none';
                stopBtn.style.display = 'block';
                statusText.innerText = '🎤 音声を聞き取っています...';
            };

            recognition.onend = () => {
                startBtn.style.display = 'block';
                stopBtn.style.display = 'none';
                statusText.innerText = '停止しました（無音が続くと自動停止します）';
            };

            recognition.onresult = (event) => {
                let interimTranscript = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        finalTranscript += transcript + '。';
                    } else {
                        interimTranscript = transcript;
                    }
                }
                resultTextArea.value = finalTranscript + interimTranscript;
                resultTextArea.scrollTop = resultTextArea.scrollHeight;
            };

            recognition.onerror = (event) => {
                console.error("エラー詳細:", event);
                
                // iOS特有のエラーメッセージを分かりやすく表示
                if (event.error === 'not-allowed') {
                    statusText.innerText = "エラー: マイクへのアクセスが拒否されました。設定を確認してください。";
                } else if (event.error === 'no-speech') {
                    statusText.innerText = "エラー: 音声が検出されませんでした。";
                } else {
                    statusText.innerText = `エラーが発生しました: ${event.error}`;
                }
                
                startBtn.style.display = 'block';
                stopBtn.style.display = 'none';
            };
        }
    </script>
</body>
</html>
